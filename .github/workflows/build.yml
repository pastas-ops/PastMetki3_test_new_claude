name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Prepare Android project (icon, version, permissions)
        run: bash native/prep.sh
      - name: Build APK with widgets
        id: wb
        continue-on-error: true
        run: python3 native/install.py && cd android && ./gradlew assembleDebug
      - name: Verify APK (icon, version, widgets, permissions)
        if: steps.wb.outcome == 'success'
        run: bash native/verify.sh
      - name: Fallback build WITHOUT widgets (only if the widget build failed)
        if: steps.wb.outcome == 'failure'
        run: |
          rm -rf android
          bash native/prep.sh
          cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PastMetki-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Report widget build failure
        if: steps.wb.outcome == 'failure'
        run: |
          echo "::error::Сборка с виджетами не удалась. Загружен APK БЕЗ виджетов. Смотрите лог шага 'Build APK with widgets'."
          exit 1
