/* ===== 1.1.1 ===== */
html{background:#0b0b12}html[data-t=light]{background:#f4f2fb}
/* заставка: на весь экран, без обрезанных прямоугольников */
.spl2{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(70% 50% at 88% 6%,rgba(106,61,240,.34),transparent 70%),radial-gradient(70% 50% at 8% 96%,rgba(255,179,0,.22),transparent 70%),#0b0b12;color:#fff;overflow:hidden}
.spl2 .sp-c{display:flex;flex-direction:column;align-items:center;transform:translateY(-4vh)}
.spl2 .sp-logo{width:112px;height:auto;filter:drop-shadow(0 10px 30px rgba(255,196,0,.28));animation:spIn .7s cubic-bezier(.2,.9,.3,1.2) both,spFl 3.2s .8s ease-in-out infinite}
.spl2 .sp-name{font:400 34px Bungee,Impact,sans-serif;margin:20px 0 0;letter-spacing:.5px;animation:fadeUp .6s .2s both}
.spl2 .sp-dots{display:flex;gap:8px;margin-top:26px;height:10px}
.spl2 .sp-dots i{width:8px;height:8px;border-radius:50%;background:#FFC400;opacity:.35;animation:spD 1.1s ease-in-out infinite}
.spl2 .sp-dots i:nth-child(2){animation-delay:.18s}.spl2 .sp-dots i:nth-child(3){animation-delay:.36s}
.spl2.out{animation:spOut .45s ease forwards;pointer-events:none}
@keyframes spIn{from{opacity:0;transform:scale(.6) rotate(-10deg)}}
@keyframes spFl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes spD{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
@keyframes spOut{to{opacity:0;transform:scale(1.05)}}
.wel{overflow:visible}.wel .blob{position:fixed}
/* карточка профиля: крестик, длинные имена, огонёк справа сверху */
.pcx{position:absolute;top:10px;right:10px;z-index:5;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center;border:1px solid rgba(255,255,255,.22);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);transition:background .15s,transform .15s}
.pcx:hover{background:rgba(0,0,0,.65);transform:scale(1.06)}
.pc3.hx .nm{padding-right:30px}
.pc3 .pa .fbd{top:-8px;bottom:auto;right:-8px}
.pc3 .nm b{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;white-space:normal;overflow-wrap:anywhere;text-overflow:clip;line-height:1.12}
.pf-name{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;white-space:normal;overflow-wrap:anywhere;text-overflow:clip;line-height:1.12}
/* стили сообщений: текст всегда читается */
.snm{color:var(--acc)}
.me .bb:not(.st) .sm,.me .bb:not(.st) .itm{color:#000;opacity:.72}
.me .bb:not(.st) .itm{background:rgba(0,0,0,.12)}
.me .bb:not(.st) .tk.on span,.me .bb:not(.st) .dn2{color:#000;opacity:.55}
.bb.st .circ{border-color:var(--tx)!important}
.bb.st .circ[style*=background]{background:var(--tx)!important}
.bb.st .circ span{color:var(--tv)!important}
.bb.st .ck{border-color:var(--tx);color:var(--tv)}
.bb.st .tk.on .ck{background:var(--tx);border-color:var(--tx);transform:none}
.tk.on .itm{text-decoration:none}
.bb.st .tk.on span,.bb.st .dn2{color:inherit;opacity:.62}
.bb.st .sm,.bb.st .snm{color:inherit}
.bb.st .sm{opacity:.82}
.bb.st .itm{color:inherit;background:var(--tp)}
.bb.st .itm.od{background:var(--bad);color:#fff;text-shadow:none}
.bb.st .qt{border-color:var(--tx)}
.bb.st .atd{background:var(--tp);color:inherit}.bb.st .atd small{color:inherit;opacity:.75}
.bb.tl{--tv:#111;--tp:rgba(255,255,255,.22);text-shadow:0 1px 2px rgba(0,0,0,.38)}
.bb.td{--tv:#fff;--tp:rgba(0,0,0,.13)}
.bb.tc{--tv:var(--bg);--tp:var(--en)}
/* меню (три полоски) */
.mnu{width:240px;padding:8px;transform-origin:top right;animation:mnuIn2 .24s cubic-bezier(.22,.9,.28,1) both}
.mnu.out{animation:mnuOut2 .17s ease forwards;pointer-events:none}
.mnu .mx{display:flex;align-items:center;justify-content:center;width:34px;height:34px;padding:0;margin:0 0 4px auto;border-radius:50%;background:var(--en);color:var(--fg)}
.mnu button{justify-content:flex-start;gap:12px;font-weight:500;transition:background .15s,box-shadow .15s}
.mnu button svg{flex:none;color:var(--sub);transition:color .15s}
.mnu button i{margin-left:auto}
.mnu hr{border:0;height:1px;background:var(--bd);margin:6px 4px}
.mnu .mo,.mnu .mo svg{color:var(--bad)}
@media (hover:hover){.mnu button:hover{background:rgba(255,196,0,.13);box-shadow:inset 0 0 0 1px rgba(255,196,0,.38)}.mnu button:hover svg{color:var(--acc)}.mnu .mx:hover{box-shadow:none;background:var(--bd)}.mnu .mo:hover svg{color:var(--bad)}}
.hb.on{box-shadow:0 0 0 1.5px var(--acc),0 0 14px rgba(255,196,0,.35);background:rgba(255,196,0,.08)}
@keyframes mnuIn2{from{opacity:0;transform:translateY(-8px) scale(.94)}}
@keyframes mnuOut2{to{opacity:0;transform:translateY(-6px) scale(.95)}}
/* сайт на ПК: боковое меню и аватар сверху */
.tav{display:none}
@media (min-width:900px){
 .sfoot{margin-top:12px;padding-top:12px;border-top:1px solid var(--bd);gap:2px}
 .sbtn.sm2{padding:9px 14px;font-size:14px;font-weight:600;border-radius:12px;color:var(--sub);transition:background .15s,color .15s,box-shadow .15s}
 .snav button:hover:not(.on),.sbtn:hover{background:rgba(255,196,0,.13);color:var(--fg);box-shadow:inset 0 0 0 1px rgba(255,196,0,.38)}
 .tav{display:block;position:fixed;top:10px;right:24px;z-index:8;padding:0;border-radius:50%;line-height:0;transition:transform .15s,box-shadow .15s}
 .tav:hover{transform:scale(1.06);box-shadow:0 0 0 2px var(--acc)}
}

/* ===== 1.1.1: форма новой заметки ===== */
.nft{position:relative}
.nft>input{padding-right:162px}
.nfi{display:flex;gap:6px;align-items:center}
.nft .nfi{position:absolute;right:6px;top:50%;transform:translateY(-50%)}
.nfb{position:relative;width:34px;height:34px;border-radius:50%;border:1.5px solid rgba(255,196,0,.6);color:var(--acc);display:grid;place-items:center;flex:none;padding:0;background:rgba(255,196,0,.06);transition:background .15s,transform .12s,color .15s,box-shadow .15s;cursor:pointer;overflow:hidden}
.nfb:hover{background:rgba(255,196,0,.18);box-shadow:0 0 0 3px rgba(255,196,0,.12)}
.nfb:active{transform:scale(.9)}
.nfb.on{background:var(--acc);color:#000;border-color:var(--acc)}
.nfb input{position:absolute;inset:0;width:100%;height:100%;opacity:0;padding:0;margin:0;cursor:pointer;font-size:16px;border-radius:50%;background:transparent}
.nfi.s .nfb{width:28px;height:28px}.nfi.s .nfb svg{width:15px;height:15px}
.nfr input[data-m=i]{min-width:0}
.nfc{display:flex;align-items:center;gap:6px;margin:8px 2px 0;font-size:12px}
.nfc.s{margin:2px 0 4px 22px}
.nfc span{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;background:rgba(255,196,0,.14);color:var(--fg);font-size:12px;line-height:1.3}
.nfc span svg{color:var(--acc);flex:none}
.nfc .x{width:24px;height:24px;font-size:12px}
@media (max-width:420px){.nft>input{padding-right:142px}.nfb{width:31px;height:31px}.nft .nfi{gap:4px}.nfi.s .nfb{width:27px;height:27px}}
/* окно файлов */
.atmh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.atmh b{font-size:19px}
.drop{border:2px dashed rgba(255,196,0,.55);border-radius:18px;padding:20px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;background:rgba(255,196,0,.05);transition:background .15s,border-color .15s,transform .15s}
.drop.ov{background:rgba(255,196,0,.17);border-color:var(--acc);transform:scale(1.015)}
.drop .dpi{width:52px;height:52px;border-radius:50%;border:2px dashed var(--acc);display:grid;place-items:center;color:var(--acc);margin-bottom:6px}
.drop .btn{display:inline-block;width:auto;padding:10px 20px;margin-top:12px;cursor:pointer}
.drop .dt{display:none}
@media (hover:none){.drop .dd{display:none}.drop .dt{display:block}}
@media (min-width:900px){.pg:not(.t-s){padding-top:60px}}
