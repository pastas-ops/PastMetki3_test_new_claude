.row{display:flex;gap:8px;align-items:center;margin-top:8px}.row input{flex:1}

.bd{font-size:12px;background:var(--en);border-radius:8px;padding:2px 7px}.bd.od{background:var(--bad);color:#fff}

nav button i{font-style:normal;font-size:20px}nav button.on{background:var(--acc);color:#000;font-weight:700;transform:translateY(-4px)}
.av{border-radius:50%;background:#8b8b90;color:#fff;display:grid;place-items:center;font-weight:700;overflow:hidden;flex:none;object-fit:cover}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}

.cal .t{box-shadow:inset 0 0 0 2px var(--acc)}.cal .r{background:var(--bad);color:#fff}.cal .y{background:var(--acc);color:#000}.cal .g{background:#2fb344;color:#fff}.cal .s{outline:2px solid var(--fg);outline-offset:1px}
.fab{position:fixed;right:18px;bottom:calc(92px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--acc);color:#000;font-size:30px;box-shadow:0 6px 18px #0004;z-index:7}.an .fab{animation:pop .4s .2s both}
.msg{display:flex;gap:8px;margin:8px 0}.msg.me{flex-direction:row-reverse}
.bb{max-width:78%;background:var(--card);border-radius:16px;padding:9px 12px}.me .bb{background:var(--acc);color:#000}
.me .ck{border-color:#000}.me .tk.on .ck{background:#000;color:var(--acc)}

.auth{max-width:380px;margin:0 auto;padding:40px 20px;text-align:center}.auth .lg{font-size:38px}.an .auth .lg{animation:spl .7s cubic-bezier(.2,.9,.3,1.3)}
.auth form>*,.auth .in{margin-top:10px}.an .auth form>*,.an .auth .in{animation:up .5s both}.err{color:var(--bad);font-size:14px;min-height:20px}
.lk{color:var(--acc);margin-top:16px}
dialog{border:0;border-radius:20px;background:var(--card);color:var(--fg);width:min(92vw,380px);padding:20px}dialog[open]{animation:pop .3s}dialog::backdrop{background:#0009}
label{display:flex;gap:10px;align-items:center;padding:7px 0}label input{width:auto}
.dv{text-align:center;color:var(--sub);font-size:12px;margin:14px 0}
.pg.chat{padding:0 14px;display:flex;flex-direction:column;min-height:calc(100vh - 62px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:calc(100dvh - 62px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}.pg.chat #mlist{flex:1;padding-bottom:10px}.pg.chat .cw{bottom:0;margin-top:0;padding-bottom:8px}.tk span{display:block;flex:1;min-width:0;max-height:9em;overflow-y:auto}.tt{max-height:9em;overflow-y:auto}.bb .hd b{display:block;max-height:9em;overflow-y:auto}dialog{max-height:88vh;overflow-y:auto}
.qt{border-left:3px solid var(--acc);padding:2px 8px;margin-bottom:5px;font-size:13px;opacity:.85;max-height:3.2em;overflow:hidden}.me .qt{border-color:#000}.rb{display:flex;align-items:center;gap:8px;border-left:3px solid var(--acc);padding:4px 8px;margin-bottom:8px;font-size:13px}.rb div{flex:1;max-height:2.6em;overflow:hidden}
.msg{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .2s}.card.rq{text-align:center}
.sw{display:flex;justify-content:space-between;align-items:center;padding:10px 0;cursor:pointer}.sw b{width:46px;height:27px;border-radius:14px;background:var(--en);position:relative;transition:background .25s;flex:none;margin-left:10px}.sw b::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:left .25s,background .25s;box-shadow:0 1px 3px #0004}.sw b.on{background:var(--acc)}.sw b.on::after{left:22px;background:#000}
select{width:100%;background:var(--en);color:var(--fg);border:0;border-radius:12px;padding:12px;font:inherit;margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:14px;opacity:0;transition:.25s;z-index:99;max-width:80vw;text-align:center}.toast.o{opacity:.95;transform:translate(-50%,0)}
.an[data-d="1"] .pg{animation:sr .32s cubic-bezier(.2,.8,.2,1)}.an[data-d="-1"] .pg{animation:sl .32s cubic-bezier(.2,.8,.2,1)}@keyframes sr{from{opacity:0;transform:translateX(70px)}}@keyframes sl{from{opacity:0;transform:translateX(-70px)}}@keyframes ex{from{opacity:0;transform:translateY(-8px)}}
.row.new{animation:ex .25s both}.cit{max-height:170px;overflow-y:auto;scroll-behavior:smooth}
.pg.chat{margin-bottom:calc(0px - env(safe-area-inset-bottom,0px));min-height:calc(100vh - 62px - env(safe-area-inset-top,0px));min-height:calc(100dvh - 62px - env(safe-area-inset-top,0px))}
.pg.chat .cw{bottom:0;margin:0 -14px;padding:10px 14px calc(8px + env(safe-area-inset-bottom,0px));border-radius:22px 22px 0 0;background:rgba(255,253,242,.55);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);box-shadow:0 -6px 24px #0002}
:root[data-t=dark] .pg.chat .cw{background:rgba(26,26,30,.5)}.pg.chat .cw input{background:rgba(127,127,127,.2)}
.dn2{text-decoration:line-through;opacity:.7}.pg{touch-action:pan-y}body{overscroll-behavior-x:none}@keyframes nv{from{transform:translateY(110%)}}nav.in,.an nav{animation:nv .32s cubic-bezier(.2,.8,.2,1)}html,body{overflow-x:hidden}

.card.cat{border-left:4px solid var(--a)}
